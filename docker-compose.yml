version: '3.8'

services:
  api-service:
    build: ./services/api-service
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:///./veriface.db
      - CORS_ORIGINS=http://localhost:80,http://localhost:5173
      - UPLOAD_FOLDER=./uploads
      - INFERENCE_SERVICE_URL=http://inference-service:5001
    volumes:
      - ./services/api-service/uploads:/app/uploads
      - ./services/api-service/veriface.db:/app/veriface.db
    depends_on:
      - inference-service

  inference-service:
    build: ./services/inference-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    volumes:
      - ./services/inference-service/model:/app/model

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-service
